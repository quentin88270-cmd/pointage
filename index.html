<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MEDIACO - Pointage</title>

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MEDIACO">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fbbc04">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>

<style>
    *, *::before, *::after { box-sizing: border-box; }
    body, html {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        /* Couleur de fond = couleur de la nav MEDIACO pour combler les safe-areas */
        background-color: #1a1a1a;
    }
    iframe {
        position: fixed;
        /* Couvre TOUT l'écran y compris safe-areas */
        top: 0; left: 0;
        width: 100%; height: 100%;
        /* Utilise dvh pour couvrir jusqu'en bas sur iPhone */
        height: 100dvh;
        border: none;
        display: none;
        /* Pas de marges safe-area — l'app gère elle-même son padding */
    }
    #splash-screen {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        background-color: #fbbc04;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        z-index: 9999;
        /* Couvre aussi les safe-areas */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .loader { border: 6px solid #fff; border-top: 6px solid #000; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loading-text { font-family: Arial, sans-serif; font-weight: bold; color: #000; text-transform: uppercase; letter-spacing: 2px; font-size: 14px; }
    #pwa-install-banner { display: none; position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 99999; width: calc(100% - 2rem); max-width: 420px; font-family: Arial, sans-serif; }
    #pwa-install-banner .banner-inner { background: linear-gradient(135deg, #1a1a1a, #2a2a2a); border: 1px solid rgba(251,188,4,0.5); border-radius: 18px; padding: 1rem 1.2rem; box-shadow: 0 8px 40px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 1rem; }
    .banner-logo { font-size: 2.2rem; flex-shrink: 0; }
    .banner-text { flex: 1; min-width: 0; }
    .banner-title { font-size: 0.95rem; color: #fbbc04; font-weight: 700; letter-spacing: 1px; }
    .banner-sub { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-top: 0.15rem; }
    .banner-actions { display: flex; flex-direction: column; gap: 0.4rem; flex-shrink: 0; }
    #pwa-install-btn { background: #fbbc04; color: #000; border: none; border-radius: 20px; padding: 0.45rem 1rem; font-size: 0.8rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
    #pwa-dismiss-btn { background: none; border: none; color: rgba(255,255,255,0.35); font-size: 0.7rem; cursor: pointer; text-align: center; }
    #pwa-ios-hint { display: none; background: rgba(26,26,26,0.97); border: 1px solid rgba(251,188,4,0.25); border-radius: 12px; padding: 0.9rem 1.1rem; margin-top: 0.6rem; font-size: 0.8rem; color: rgba(255,255,255,0.75); line-height: 1.8; text-align: center; }
    #pwa-ios-hint strong { color: #fbbc04; }
    .pwa-hint-btn { display: inline-block; margin-top: 0.5rem; background: rgba(251,188,4,0.15); border: 1px solid rgba(251,188,4,0.35); border-radius: 20px; padding: 0.3rem 1rem; font-size: 0.72rem; color: #fbbc04; cursor: pointer; }
    .pwa-hint-never { display: block; margin-top: 6px; font-size: 0.65rem; color: rgba(255,255,255,0.25); cursor: pointer; }
    #notif-banner { display: none; position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 99998; width: calc(100% - 2rem); max-width: 420px; background: linear-gradient(135deg, #1a1a1a, #2a2a2a); border: 1px solid rgba(251,188,4,0.4); border-radius: 14px; padding: 0.9rem 1.1rem; font-family: Arial, sans-serif; box-shadow: 0 6px 30px rgba(0,0,0,0.5); text-align: center; }
    #notif-banner p { margin: 0 0 0.6rem; color: white; font-size: 0.85rem; }
    #notif-banner strong { color: #fbbc04; }
    #notif-accept-btn { background: #fbbc04; color: #000; border: none; border-radius: 20px; padding: 0.45rem 1.2rem; font-weight: 700; font-size: 0.82rem; cursor: pointer; margin-right: 8px; }
    #notif-later-btn { background: none; border: none; color: rgba(255,255,255,0.4); font-size: 0.72rem; cursor: pointer; }
</style>
</head>
<body>

<div id="splash-screen">
    <div class="loader"></div>
    <div class="loading-text">CREATEUR DE POINTAGE</div>
</div>

<iframe id="app-frame"
    src="https://script.google.com/macros/s/AKfycbw2rKJ6ssrFiFKNcX8EwPTl4RFFueAOhlgcI64q0OhKwTZCmIdZCS0qdr3A-zTxN1GBfA/exec"
    onload="hideLoader()">
</iframe>

<!-- PWA Install Banner -->
<div id="pwa-install-banner">
    <div class="banner-inner">
        <div class="banner-logo">🏗️</div>
        <div class="banner-text">
            <div class="banner-title">MEDIACO Pointage</div>
            <div class="banner-sub">Installe l'app sur ton téléphone !</div>
        </div>
        <div class="banner-actions">
            <button id="pwa-install-btn">📲 Installer</button>
            <button id="pwa-dismiss-btn">Ne plus me demander</button>
        </div>
    </div>
    <div id="pwa-ios-hint">
        Sur <strong>iPhone</strong> : appuie sur <strong>Partager</strong> ⬆️<br>
        puis <strong>"Sur l'écran d'accueil"</strong> ➕
        <br>
        <span class="pwa-hint-btn" onclick="dismissPWA()">J'ai compris ✓</span>
        <span class="pwa-hint-never" onclick="dismissPWAForever()">Ne plus me demander</span>
    </div>
</div>

<!-- Notification permission banner -->
<div id="notif-banner">
    <p>🔔 <strong>Activer les notifications</strong><br>
    Reçois une alerte si tu oublies de pointer !</p>
    <button id="notif-accept-btn" onclick="demanderPermissionNotif()">✅ Activer</button>
    <button id="notif-later-btn" onclick="dismissNotifBanner()">Plus tard</button>
</div>



<script>
// ── Splash screen ──
function hideLoader() {
    document.getElementById('splash-screen').style.display = 'none';
    document.getElementById('app-frame').style.display = 'block';

    setTimeout(function() {
        // Attendre que l'utilisateur soit connecté (PIN présent) avant de demander les notifs
        const pinConnecte = localStorage.getItem('mediaco_pin');
        if (pinConnecte && !localStorage.getItem('notif_asked') && Notification.permission === 'default') {
            document.getElementById('notif-banner').style.display = 'block';
        }
    }, 5000);
}
setTimeout(function() { hideLoader(); }, 15000);

// ══════════════════════════════════
// FIREBASE FCM
// ══════════════════════════════════
firebase.initializeApp({
    apiKey: "AIzaSyDLjmeAbZEUNrskkn-THIFzY7d8Brk4nAI",
    authDomain: "pointage-mediaco.firebaseapp.com",
    projectId: "pointage-mediaco",
    storageBucket: "pointage-mediaco.firebasestorage.app",
    messagingSenderId: "123659872809",
    appId: "1:123659872809:web:6d94c82b2585652899ca38",
    measurementId: "G-C1JWK63LNJ"
});

const messaging = firebase.messaging();
const VAPID_KEY = "BEhXwNCHtFPGdHFkjJFREn6CV7dKL0yDamPxVjNWpNq9W1JnZ190x5CgecglOJ10n3iavfaoNaYGzs1RJflPz-A";

let _swRegistration = null;

if ('serviceWorker' in navigator) {
    const swPath = window.location.pathname.includes('/pointage/') 
        ? './firebase-messaging-sw.js'
        : '/firebase-messaging-sw.js';
    navigator.serviceWorker.register(swPath)
        .then(function(reg) {
            console.log('[FCM] ✅ SW enregistré:', reg.scope);
            _swRegistration = reg;
        })
        .catch(function(err) {
            console.warn('[FCM] ⚠️ SW erreur:', err);
            afficherDebug('⚠️ SW erreur: ' + err.message);
        });
}

messaging.onMessage(function(payload) {
    // Message reçu en foreground — le Service Worker gère déjà l'affichage
    // On ne crée PAS de nouvelle Notification ici pour éviter le doublon
    console.log('[FCM] Message foreground reçu (affiché par SW):', payload);
});

// ── Reset localStorage + relancer la demande de permission


function demanderPermissionNotif() {
    dismissNotifBanner();
    localStorage.setItem('notif_asked', '1');
    // Demander le PIN si pas encore connu sur ce domaine
    if (!localStorage.getItem('mediaco_pin_github')) {
        var pin = prompt('Entre ton code PIN (4 chiffres) pour activer les notifications :');
        if (pin && pin.trim().length >= 1) {
            localStorage.setItem('mediaco_pin_github', String(parseInt(pin)||pin).padStart(4,'0'));
        }
    }
    Notification.requestPermission().then(function(permission) {
        if (permission === 'granted') {
            obtenirEtEnvoyerToken();
        }
    });
}

function dismissNotifBanner() {
    document.getElementById('notif-banner').style.display = 'none';
}

// ── URL Apps Script déployée
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2rKJ6ssrFiFKNcX8EwPTl4RFFueAOhlgcI64q0OhKwTZCmIdZCS0qdr3A-zTxN1GBfA/exec';

// ── Envoyer token FCM via GET direct vers Apps Script (pas de cross-origin issue)
function envoyerTokenFCMauServeur(token) {
    const pin = localStorage.getItem('mediaco_pin_github');
    if (!pin) {
        afficherDebug('⏳ PIN pas encore connu — token stocké, attente PIN...');
        localStorage.setItem('pending_fcm_token_github', token);
        return;
    }
    afficherDebug('📤 Envoi vers Apps Script — PIN: ' + pin);
    // Utiliser une image (no-cors) pour contourner CORS sur GET Apps Script
    var url = APPS_SCRIPT_URL + '?action=saveFCMToken&pin=' + encodeURIComponent(pin) + '&token=' + encodeURIComponent(token);
    var img = new Image();
    img.onload = function() { afficherDebug('✅ Token envoyé (img)'); };
    img.onerror = function() {
        // Normal — Apps Script renvoie JSON pas une image, mais la requête passe quand même
        afficherDebug('✅ Requête envoyée (vérifier col G)');
        localStorage.removeItem('pending_fcm_token_github');
    };
    img.src = url;
    // Aussi tenter fetch no-cors
    fetch(url, { method: 'GET', mode: 'no-cors' })
      .then(function() { afficherDebug('✅ Fetch no-cors envoyé'); localStorage.removeItem('pending_fcm_token_github'); })
      .catch(function(err) { afficherDebug('⚠️ Fetch: ' + err.message); });
}

// Recevoir le PIN depuis l'iframe Apps Script
window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'MEDIACO_PIN') {
        const pin = event.data.pin;
        if (pin) {
            localStorage.setItem('mediaco_pin_github', pin);
            afficherDebug('📌 PIN reçu depuis iframe: ' + pin);
            const pending = localStorage.getItem('pending_fcm_token_github');
            if (pending) envoyerTokenFCMauServeur(pending);
        }
    }
});

// Vérifier toutes les 2s si PIN disponible dans localStorage GitHub
// (le PIN est copié ici lors de la connexion via INDEX_STABLE → postMessage)
setInterval(function() {
    const pin = localStorage.getItem('mediaco_pin_github');
    const pending = localStorage.getItem('pending_fcm_token_github');
    if (pin && pending) {
        afficherDebug('⏰ Interval: PIN trouvé, envoi token...');
        envoyerTokenFCMauServeur(pending);
    }
}, 2000);

function obtenirEtEnvoyerToken() {
    afficherDebug('🚀 Génération token FCM...');
    navigator.serviceWorker.ready.then(function(reg) {
        afficherDebug('SW scope: ' + reg.scope);
        return reg.pushManager.getSubscription().then(function(sub) {
            if (sub) {
                afficherDebug('🗑️ Ancien abonnement supprimé');
                return sub.unsubscribe().then(() => reg);
            }
            return reg;
        });
    })
    .then(function(reg) {
        return messaging.getToken({ 
            vapidKey: VAPID_KEY,
            serviceWorkerRegistration: reg
        });
    })
    .then(function(token) {
        if (!token) { afficherDebug('❌ Pas de token généré'); return; }
        afficherDebug('✅ Token: ' + token.substring(0, 25) + '...');
        localStorage.setItem('fcm_token', token);

        // Stocker le token localement et tenter envoi si PIN connu
        localStorage.setItem('pending_fcm_token_github', token);
        afficherDebug('💾 Token stocké localement');
        envoyerTokenFCMauServeur(token);
    })
    .catch(function(err) {
        afficherDebug('❌ ' + err.message + (err.code ? ' [' + err.code + ']' : ''));
    });
}

// ── Log console uniquement (pas d'affichage visible)
function afficherDebug(msg) {
    console.log('[FCM]', msg);
}

window.addEventListener('load', function() {
    if (Notification.permission === 'granted') {
        setTimeout(obtenirEtEnvoyerToken, 3000);
    }
    window.debugFCMToken = function() { obtenirEtEnvoyerToken(); };
});

// ══════════════════════════════════
// PWA Install
// ══════════════════════════════════
var _deferredInstall = null;

function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault(); _deferredInstall = e;
    // Vérifier toutes les 2s si le PIN est connecté, puis afficher
    var checkPin = setInterval(function() {
        if (localStorage.getItem('mediaco_pin_github')) {
            clearInterval(checkPin);
            setTimeout(showInstallBanner, 2000);
        }
    }, 2000);
    setTimeout(function() { clearInterval(checkPin); }, 300000);
});

function showInstallBanner() {
    if (isStandalone()) return;
    if (localStorage.getItem('pwa_installed')) return; // déjà installé
    // Ne pas afficher si déjà refusé cette session
    if (sessionStorage.getItem('pwa_dismissed_session')) return;
    // Ne pas afficher si pas encore connecté
    if (!localStorage.getItem('mediaco_pin_github')) return;
    var banner = document.getElementById('pwa-install-banner');
    if (!banner) return;
    if (isIOS()) {
        banner.style.display = 'block';
        document.getElementById('pwa-install-btn').style.display = 'none';
        document.getElementById('pwa-ios-hint').style.display = 'block';
    } else if (_deferredInstall) {
        banner.style.display = 'block';
    } else {
        banner.style.display = 'block';
        document.getElementById('pwa-install-btn').style.display = 'none';
        document.getElementById('pwa-ios-hint').innerHTML =
            'Sur <strong>Android</strong> : appuie sur ⋮ <strong>Menu</strong><br>' +
            'puis <strong>"Ajouter à l\'écran d\'accueil"</strong> ➕' +
            '<br><span class="pwa-hint-btn" onclick="dismissPWA()">J\'ai compris ✓</span>' +
            '<span class="pwa-hint-never" onclick="dismissPWAForever()">Ne plus me demander</span>';
        document.getElementById('pwa-ios-hint').style.display = 'block';
    }
}

document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('pwa-install-btn').addEventListener('click', function() {
        if (!_deferredInstall) return;
        _deferredInstall.prompt();
        _deferredInstall.userChoice.then(function(r) {
            if (r.outcome === 'accepted') dismissPWAForever();
            _deferredInstall = null;
        });
    });
    document.getElementById('pwa-dismiss-btn').addEventListener('click', dismissPWAForever);
    if (isIOS() && !isStandalone() && !sessionStorage.getItem('pwa_dismissed_session') && localStorage.getItem('mediaco_pin_github')) {
        setTimeout(showInstallBanner, 3000);
    }
});

function dismissPWA() { document.getElementById('pwa-install-banner').style.display = 'none'; }
function dismissPWAForever() {
    document.getElementById('pwa-install-banner').style.display = 'none';
    // Juste pour la session — pas de localStorage permanent
    sessionStorage.setItem('pwa_dismissed_session', '1');
}
window.addEventListener('appinstalled', function() {
    document.getElementById('pwa-install-banner').style.display = 'none';
    localStorage.setItem('pwa_installed', '1'); // installé = ne plus jamais afficher
});
</script>
</body>
</html>
